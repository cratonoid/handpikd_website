<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HANDPIKD Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #1a1a2e; --accent: #e8b04b; --accent2: #c49a3c;
      --danger: #d64545; --muted: #888; --border: #e0ddd5;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--brand);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: 2px; color: var(--brand); text-align: center; }
    .logo-sub { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; text-align: center; margin-bottom: 32px; }

    .form-title { font-size: 1.1rem; font-weight: 700; color: var(--brand); margin-bottom: 4px; text-align: center; }
    .form-sub   { font-size: .84rem; color: var(--muted); text-align: center; margin-bottom: 28px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .field input {
      border: 2px solid var(--border); border-radius: 8px;
      padding: 12px 14px; font-size: .97rem; color: var(--brand);
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,176,75,.15); }
    .field input.err  { border-color: var(--danger); }

    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 44px; width: 100%; }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted); line-height: 0; padding: 4px;
    }
    .toggle-pass:hover { color: var(--brand); }

    .error-msg { color: var(--danger); font-size: .82rem; margin-bottom: 12px; display: none; }
    .error-msg.show { display: block; }

    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background .2s, transform .1s; letter-spacing: .3px;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: #2a2a45; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* spinner */
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(232,176,75,.2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 24px; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">HANDPIKD</div>
  <div class="logo-sub">Customer Portal</div>

  <div id="loading"><div class="spinner"></div></div>

  <!-- Login form -->
  <div id="login-form" style="display:none">
    <div class="form-title">Welcome back</div>
    <div class="form-sub">Sign in to your account</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="l-email" placeholder="you@company.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pass-wrap">
        <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
        <button class="toggle-pass" type="button" onclick="togglePass('l-pass',this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="error-msg" id="l-err"></div>
    <button class="btn btn-primary" id="l-btn" onclick="doLogin()">Sign In</button>
  </div>

  <!-- First-time setup form -->
  <div id="setup-form" style="display:none">
    <div class="form-title">First Time Setup</div>
    <div class="form-sub">Create your admin account to get started</div>

    <div class="field">
      <label>Your Name</label>
      <input type="text" id="s-name" placeholder="Full name" autocomplete="name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="s-email" placeholder="admin@handpikd.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pass-wrap">
        <input type="password" id="s-pass" placeholder="Choose a strong password"
          onkeydown="if(event.key==='Enter')doSetup()">
        <button class="toggle-pass" type="button" onclick="togglePass('s-pass',this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="error-msg" id="s-err"></div>
    <button class="btn btn-primary" id="s-btn" onclick="doSetup()">Create Admin Account</button>
  </div>
</div>

<script>
const API = 'https://supernotes.onrender.com';

function bearerHeaders() {
  const token = localStorage.getItem('hpkd_token');
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

(async function () {
  try {
    const token = localStorage.getItem('hpkd_token');
    if (token) {
      try {
        const me = await fetch(`${API}/api/auth/me`, { headers: bearerHeaders() });
        if (me.ok) {
          const u = await me.json();
          location.href = u.isAdmin ? '/portal/admin' : '/portal/';
          return;
        }
      } catch (_) {}
      localStorage.removeItem('hpkd_token');
    }

    const res = await fetch(`${API}/api/auth/needs-setup`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const ns = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById(ns.needsSetup ? 'setup-form' : 'login-form').style.display = '';
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:#d64545;text-align:center;padding:20px;font-size:.9rem">
        Cannot reach server.<br>
        <span style="color:#888;font-size:.82rem">Error: ${e.message}</span>
      </p>`;
  }
})();

function togglePass(id, btn) {
  const inp  = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type   = show ? 'text' : 'password';
  btn.innerHTML = show
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  const btn   = document.getElementById('l-btn');

  errEl.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Signing in…';

  try {
    const res  = await fetch(`${API}/api/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    localStorage.setItem('hpkd_token', data.token);
    location.href = data.isAdmin ? '/portal/admin' : '/portal/';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = 'Sign In';
    document.getElementById('l-pass').value = '';
  }
}

async function doSetup() {
  const name  = document.getElementById('s-name').value.trim();
  const email = document.getElementById('s-email').value.trim();
  const pass  = document.getElementById('s-pass').value;
  const errEl = document.getElementById('s-err');
  const btn   = document.getElementById('s-btn');

  errEl.classList.remove('show');
  if (!name || !email || !pass) {
    errEl.textContent = 'All fields are required.';
    errEl.classList.add('show'); return;
  }

  btn.disabled = true; btn.textContent = 'Creating account…';

  try {
    const res  = await fetch(`${API}/api/auth/setup`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password: pass })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    // Setup done — log in automatically
    const lr   = await fetch(`${API}/api/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    if (lr.ok) {
      const ld = await lr.json();
      localStorage.setItem('hpkd_token', ld.token);
      location.href = '/portal/admin'; return;
    }
    // Fallback: show login form
    document.getElementById('setup-form').style.display = 'none';
    document.getElementById('login-form').style.display = '';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = 'Create Admin Account';
  }
}
</script>
</body>
</html>
