<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse GST / % Calculator — HANDPIKD</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:   #1a1a2e;
      --accent:  #e8b04b;
      --accent2: #c49a3c;
      --bg:      #f5f5f0;
      --card:    #ffffff;
      --border:  #e0ddd5;
      --text:    #2c2c2c;
      --muted:   #888;
      --danger:  #d64545;
      --radius:  10px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--brand);
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header h1  { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
    header span { font-size: .85rem; color: var(--accent); font-weight: 500; margin-left: auto; }

    .container { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

    .page-title    { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; color: var(--brand); }
    .page-subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 28px; }

    /* ── Rate tabs ── */
    .rate-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .rate-tab {
      padding: 8px 20px;
      border-radius: 20px;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: .88rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .18s;
    }
    .rate-tab:hover  { border-color: var(--accent); color: var(--accent2); }
    .rate-tab.active { background: var(--brand); border-color: var(--brand); color: var(--accent); }
    .rate-tab.custom-tab.active { background: #5a3e9e; border-color: #5a3e9e; color: #e0d0ff; }

    .custom-default-wrap {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .custom-default-wrap.visible { display: flex; }
    .custom-default-wrap label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); white-space: nowrap; }
    .custom-default-wrap input {
      border: 2px solid #c4aef0;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .95rem;
      color: var(--text);
      background: #f9f6ff;
      width: 130px;
      transition: border-color .2s, box-shadow .2s;
    }
    .custom-default-wrap input:focus {
      outline: none;
      border-color: #7c5cbf;
      box-shadow: 0 0 0 3px rgba(124,92,191,.15);
    }

    /* ── Rows list ── */
    #rows-list { display: flex; flex-direction: column; gap: 16px; }

    .row-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
    }

    .row-header {
      background: var(--brand);
      color: #fff;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 600;
      font-size: .92rem;
    }
    .row-num { color: var(--accent); margin-right: 8px; }

    /* ── Input mode toggle ── */
    .input-mode-toggle { display: flex; gap: 4px; margin-left: auto; }
    .imode-btn {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.22);
      color: rgba(255,255,255,.65);
      border-radius: 5px;
      padding: 3px 11px;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 600;
      transition: all .15s;
      white-space: nowrap;
    }
    .imode-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
    .imode-btn.active { background: var(--accent); border-color: var(--accent2); color: var(--brand); }

    .remove-btn {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: .8rem;
      transition: background .2s;
      white-space: nowrap;
    }
    .remove-btn:hover { background: var(--danger); border-color: var(--danger); }

    .row-body {
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr;
      gap: 16px;
      align-items: end;
    }

    /* ── Optional strips ── */
    .row-reduce, .row-reduce-gst {
      padding: 14px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px dashed var(--border);
    }
    .row-reduce label {
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .row-reduce-gst label {
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #1565c0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .row-reduce label span,
    .row-reduce-gst label span { font-weight: 400; text-transform: none; letter-spacing: 0; color: #bbb; }

    .row-reduce input {
      border: 2px solid #f5c2c2;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: .92rem;
      color: var(--text);
      background: #fff8f8;
      width: 160px;
      transition: border-color .2s, box-shadow .2s;
    }
    .row-reduce input:focus {
      outline: none;
      border-color: #d64545;
      box-shadow: 0 0 0 3px rgba(214,69,69,.12);
    }

    .row-reduce-gst select {
      border: 2px solid #90caf9 !important;
      border-radius: 8px !important;
      padding: 7px 12px !important;
      font-size: .92rem;
      color: var(--text);
      background: #f0f6ff !important;
      width: 160px !important;
      transition: border-color .2s, box-shadow .2s;
    }
    .row-reduce-gst select:focus {
      outline: none;
      border-color: #1565c0 !important;
      box-shadow: 0 0 0 3px rgba(21,101,192,.12) !important;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
    }

    input[type="text"],
    input[type="number"],
    select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: .95rem;
      color: var(--text);
      background: #fafaf8;
      width: 100%;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232,176,75,.15);
    }

    /* custom % input inside a row */
    .custom-rate-input {
      display: none;
      margin-top: 6px;
      border: 2px solid #c4aef0 !important;
      background: #f9f6ff !important;
    }
    .custom-rate-input:focus {
      border-color: #7c5cbf !important;
      box-shadow: 0 0 0 3px rgba(124,92,191,.15) !important;
    }
    .custom-rate-input.visible { display: block; }

    /* ── Result strip ── */
    .row-result {
      margin: 0 20px 18px;
      background: #f8f7f2;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: .88rem;
      display: none;
    }
    .row-result table { width: 100%; border-collapse: collapse; }
    .row-result td { padding: 3px 0; }
    .row-result td:last-child { text-align: right; font-weight: 600; }
    .row-result .highlight-row td {
      border-top: 1px solid var(--border);
      padding-top: 8px;
      color: var(--brand);
      font-weight: 700;
      font-size: .95rem;
    }
    .row-result .base-row td       { color: #2e7d32; font-size: .95rem; font-weight: 700; }
    .row-result .custom-row td     { color: #5a3e9e; font-size: .95rem; font-weight: 700; }
    .row-result .reduce-row td     { color: #d64545; font-size: .95rem; font-weight: 700; }
    .row-result .gst-remove-row td { color: #1565c0; font-size: .95rem; font-weight: 700; }
    .row-result .final-row td {
      border-top: 1px solid var(--border);
      padding-top: 8px;
      color: var(--brand);
      font-weight: 800;
      font-size: 1rem;
    }
    .row-result .net-final-row td {
      border-top: 2px solid var(--brand);
      padding-top: 8px;
      color: var(--brand);
      font-weight: 800;
      font-size: 1.05rem;
    }

    /* ── Actions ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 8px;
      border: none;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn:active  { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #1a1a2e; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-outline { background: transparent; border: 2px solid var(--brand); color: var(--brand); }
    .btn-outline:hover { background: var(--brand); color: #fff; }

    .actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 24px; }

    /* ── Summary panel ── */
    #summary {
      margin-top: 36px;
      background: var(--brand);
      color: #fff;
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }
    #summary h2 {
      font-size: 1.1rem;
      margin-bottom: 18px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      padding-bottom: 10px;
    }
    .sum-table { width: 100%; border-collapse: collapse; }
    .sum-table td { padding: 6px 0; font-size: .93rem; }
    .sum-table td:last-child { text-align: right; font-weight: 600; }
    .sum-divider td { border-top: 1px solid rgba(255,255,255,.18); padding-top: 12px; }
    .sum-total td { font-size: 1.2rem; font-weight: 800; color: var(--accent); padding-top: 10px; }
    .muted-label { color: rgba(255,255,255,.55); font-size: .83rem; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: .95rem; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: #1a1a2e; color: #fff; border-radius: 8px;
      padding: 11px 22px; font-size: .9rem; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,.3); z-index: 3000;
      opacity: 0; pointer-events: none; transition: opacity .25s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #toast.t-ok { border-left: 4px solid #4caf50; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header { padding: 12px 14px; flex-wrap: wrap; }
      header h1 { font-size: 1.1rem; }
      .container { padding: 14px 10px 40px; }
      .page-title { font-size: 1.15rem; }
      .row-body { grid-template-columns: 1fr 1fr; }
      .row-body .field:first-child { grid-column: 1 / -1; }
      .row-reduce, .row-reduce-gst { flex-wrap: wrap; }
      .input-mode-toggle { flex-wrap: wrap; }
      #summary { padding: 16px 14px 14px; }
      .sum-total td { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>HANDPIKD</h1>
  <span>Reverse GST / % Calculator</span>
</header>

<div class="container">
  <div class="page-title">Reverse GST / % Calculator</div>
  <div class="page-subtitle">Per row: optionally reverse-extract GST from a total, reduce the base by %, and remove a final GST component.</div>

  <div style="margin-bottom:20px">
    <label style="display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px">Default Rate (applied to new rows)</label>
    <div class="rate-tabs" id="rate-tabs">
      <button class="rate-tab" data-rate="5"      onclick="setDefaultRate(5)">5% GST</button>
      <button class="rate-tab" data-rate="12"     onclick="setDefaultRate(12)">12% GST</button>
      <button class="rate-tab active" data-rate="18" onclick="setDefaultRate(18)">18% GST</button>
      <button class="rate-tab" data-rate="28"     onclick="setDefaultRate(28)">28% GST</button>
      <button class="rate-tab custom-tab" data-rate="custom" onclick="setDefaultRate('custom')">Custom %</button>
    </div>
    <div class="custom-default-wrap" id="custom-default-wrap">
      <label>Enter %</label>
      <input type="number" id="custom-default-input" min="0" step="0.1" placeholder="e.g. 30"
        oninput="onCustomDefault(this.value)">
    </div>
  </div>

  <div id="rows-list">
    <div class="empty-state" id="empty-msg">No rows added yet. Click "Add Row" to begin.</div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="addRow()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Row
    </button>
    <button class="btn btn-outline" onclick="clearAll()">Clear All</button>
    <button class="btn btn-outline" onclick="copyResults()" style="border-color:var(--accent);color:var(--accent2);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy Summary
    </button>
  </div>

  <div id="summary">
    <h2>Summary</h2>
    <div id="summary-body">
      <div class="empty-state" style="color:rgba(255,255,255,.4);padding:20px 0">Add rows above to see the summary.</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {

  let counter          = 0;
  let defaultRate      = 18;
  let defaultCustomPct = null;
  const rows           = {};

  /* ── Helpers ── */
  function fmt(n) {
    return '₹' + Number(n.toFixed(2)).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function effectiveRate(d) {
    if (d.rate === 'custom') return parseFloat(d.customRate) || null;
    return d.rate;
  }

  function calcReverse(totalWithPct, rate) {
    const divisor = 1 + rate / 100;
    const base    = totalWithPct / divisor;
    const added   = totalWithPct - base;
    return { base, added, total: totalWithPct, rate };
  }

  function isGSTRate(rate) {
    return [5, 12, 18, 28].includes(rate);
  }

  /* ── Default rate tabs ── */
  window.setDefaultRate = function (rate) {
    defaultRate = rate;
    document.querySelectorAll('.rate-tab').forEach(t => {
      const v = t.dataset.rate === 'custom' ? 'custom' : parseInt(t.dataset.rate);
      t.classList.toggle('active', v === rate);
    });
    const wrap = document.getElementById('custom-default-wrap');
    if (rate === 'custom') {
      wrap.classList.add('visible');
      document.getElementById('custom-default-input').focus();
    } else {
      wrap.classList.remove('visible');
      defaultCustomPct = null;
    }
  };

  window.onCustomDefault = function (val) {
    defaultCustomPct = parseFloat(val) || null;
  };

  /* ── Toast ── */
  function toast(msg, type = 't-ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = 'show ' + type;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 2200);
  }

  /* ── Input mode toggle ── */
  window.setInputMode = function (id, mode) {
    if (!rows[id]) return;
    rows[id].inputMode = mode;

    document.getElementById('imode-rev-' + id).classList.toggle('active', mode === 'reverse');
    document.getElementById('imode-dir-' + id).classList.toggle('active', mode === 'direct');

    const lbl = document.getElementById('amt-lbl-' + id);
    if (lbl) lbl.textContent = mode === 'direct' ? 'Base Price (₹)' : 'Total Amount incl. % (₹)';

    const rateWrap = document.getElementById('rate-field-' + id);
    if (rateWrap) rateWrap.style.display = mode === 'direct' ? 'none' : '';

    renderRow(id);
  };

  /* ── Add row ── */
  window.addRow = function () {
    counter++;
    const id = 'r' + counter;

    const initialRate       = defaultRate;
    const initialCustomRate = defaultRate === 'custom' ? (defaultCustomPct || '') : '';

    rows[id] = {
      desc: '', amount: '',
      rate: initialRate, customRate: String(initialCustomRate),
      reduceBy: '',
      gstReduce: '',
      inputMode: 'reverse'
    };

    document.getElementById('empty-msg').style.display = 'none';

    const rateOpts = [
      { v: 5,        label: '5% GST'   },
      { v: 12,       label: '12% GST'  },
      { v: 18,       label: '18% GST'  },
      { v: 28,       label: '28% GST'  },
      { v: 'custom', label: 'Custom %' },
    ].map(o => `<option value="${o.v}"${o.v === initialRate ? ' selected' : ''}>${o.label}</option>`).join('');

    const card = document.createElement('div');
    card.className = 'row-card';
    card.id = 'card-' + id;
    card.innerHTML = `
      <div class="row-header">
        <span><span class="row-num">#${counter}</span> Entry</span>
        <div class="input-mode-toggle">
          <button class="imode-btn active" id="imode-rev-${id}" onclick="setInputMode('${id}','reverse')">Reverse GST</button>
          <button class="imode-btn"        id="imode-dir-${id}" onclick="setInputMode('${id}','direct')">Direct Base</button>
        </div>
        <button class="remove-btn" onclick="removeRow('${id}')">Remove</button>
      </div>
      <div class="row-body">
        <div class="field">
          <label>Description (optional)</label>
          <input type="text" id="desc-${id}" placeholder="e.g. Vendor invoice, Commission…"
            oninput="onField('${id}','desc',this.value)">
        </div>
        <div class="field">
          <label id="amt-lbl-${id}">Total Amount incl. % (₹)</label>
          <input type="number" id="amt-${id}" min="0" step="0.01" placeholder="0.00"
            oninput="onField('${id}','amount',this.value)">
        </div>
        <div class="field" id="rate-field-${id}">
          <label>Rate</label>
          <select id="rate-${id}" onchange="onRateSelect('${id}',this.value)">${rateOpts}</select>
          <input type="number" id="custom-rate-${id}" class="custom-rate-input${initialRate === 'custom' ? ' visible' : ''}"
            min="0" step="0.1" placeholder="Enter % e.g. 30"
            value="${initialCustomRate}"
            oninput="onField('${id}','customRate',this.value)">
        </div>
      </div>
      <div class="row-reduce">
        <label>Further reduce commission % <span>(optional)</span></label>
        <input type="number" id="reduce-${id}" min="0" max="100" step="0.1" placeholder="e.g. 10"
          oninput="onField('${id}','reduceBy',this.value)">
      </div>
      <div class="row-reduce-gst">
        <label>Remove GST from final <span>(optional)</span></label>
        <select id="gst-reduce-${id}" onchange="onField('${id}','gstReduce',this.value)">
          <option value="">— None —</option>
          <option value="5">5% GST</option>
          <option value="12">12% GST</option>
          <option value="18">18% GST</option>
          <option value="28">28% GST</option>
        </select>
      </div>
      <div class="row-result" id="res-${id}"></div>`;

    document.getElementById('rows-list').appendChild(card);
    document.getElementById('amt-' + id).focus();
    renderSummary();
  };

  window.onRateSelect = function (id, val) {
    if (!rows[id]) return;
    rows[id].rate = val === 'custom' ? 'custom' : parseFloat(val);
    const inp = document.getElementById('custom-rate-' + id);
    if (val === 'custom') {
      inp.classList.add('visible');
      inp.focus();
    } else {
      inp.classList.remove('visible');
      rows[id].customRate = '';
    }
    renderRow(id);
  };

  window.removeRow = function (id) {
    const c = document.getElementById('card-' + id);
    if (c) c.remove();
    delete rows[id];
    if (!Object.keys(rows).length) document.getElementById('empty-msg').style.display = '';
    renderSummary();
  };

  window.clearAll = function () {
    if (!confirm('Clear all rows?')) return;
    Object.keys(rows).forEach(id => delete rows[id]);
    document.getElementById('rows-list').innerHTML =
      '<div class="empty-state" id="empty-msg">No rows added yet. Click "Add Row" to begin.</div>';
    counter = 0;
    renderSummary();
  };

  window.onField = function (id, key, val) {
    if (!rows[id]) return;
    rows[id][key] = val;
    renderRow(id);
  };

  /* ── Compute row values ── */
  function computeRow(d) {
    const amt = parseFloat(d.amount);
    if (!amt || amt <= 0) return null;

    const mode = d.inputMode || 'reverse';
    let r;

    if (mode === 'direct') {
      // Skip reverse GST — the entered amount IS the base price
      r = { base: amt, added: 0, total: amt, rate: null };
    } else {
      const rt = effectiveRate(d);
      if (!rt || rt <= 0) return null;
      r = calcReverse(amt, rt);
    }

    const reduceBy    = parseFloat(d.reduceBy) || 0;
    const reduced     = reduceBy > 0 ? r.base * reduceBy / 100 : 0;
    const afterReduce = r.base - reduced;

    const gstReduce  = parseFloat(d.gstReduce) || 0;
    let gstComponent = 0, netFinal = afterReduce;
    if (gstReduce > 0) {
      const g      = calcReverse(afterReduce, gstReduce);
      gstComponent = g.added;
      netFinal     = g.base;
    }

    return { r, reduceBy, reduced, afterReduce, gstReduce, gstComponent, netFinal, mode };
  }

  /* ── Render single row ── */
  function renderRow(id) {
    const el = document.getElementById('res-' + id);
    if (!el) return;
    const d  = rows[id];
    const cv = computeRow(d);

    if (!cv) { el.style.display = 'none'; renderSummary(); return; }

    const { r, reduceBy, reduced, afterReduce, gstReduce, gstComponent, netFinal, mode } = cv;

    let rows_html = '';

    if (mode === 'direct') {
      rows_html += `<tr class="base-row"><td>Base price (entered directly)</td><td>${fmt(r.base)}</td></tr>`;
    } else {
      const isGST    = isGSTRate(r.rate);
      const rowClass = isGST ? 'base-row' : 'custom-row';
      const addedLbl = isGST ? `GST component (${r.rate}%)` : `% component (${r.rate}%)`;
      const baseLbl  = isGST ? 'Base price (pre-GST)'       : 'Base price (before %)';
      rows_html += `
        <tr><td>Total (inclusive)</td><td>${fmt(r.total)}</td></tr>
        <tr class="${rowClass}"><td>${baseLbl}</td><td>${fmt(r.base)}</td></tr>
        <tr><td>${addedLbl}</td><td>${fmt(r.added)}</td></tr>`;
    }

    if (reduceBy > 0) {
      rows_html += `
        <tr class="reduce-row"><td>Further reduction (${reduceBy}% of base)</td><td>− ${fmt(reduced)}</td></tr>
        <tr class="final-row"><td>Price after reduction</td><td>${fmt(afterReduce)}</td></tr>`;
    }

    if (gstReduce > 0) {
      rows_html += `
        <tr class="gst-remove-row"><td>GST removed from final (${gstReduce}%)</td><td>− ${fmt(gstComponent)}</td></tr>
        <tr class="net-final-row"><td>Net final (pre-GST)</td><td>${fmt(netFinal)}</td></tr>`;
    }

    if (mode === 'reverse') {
      rows_html += `<tr class="highlight-row"><td>Effective rate check</td><td>${((r.added / r.base) * 100).toFixed(4)}%</td></tr>`;
    }

    el.style.display = '';
    el.innerHTML = `<table>${rows_html}</table>`;
    renderSummary();
  }

  /* ── Summary ── */
  function renderSummary() {
    const ids   = Object.keys(rows);
    const valid = ids.map(id => {
      const cv = computeRow(rows[id]);
      if (!cv) return null;
      return { id, d: rows[id], ...cv };
    }).filter(Boolean);

    const body = document.getElementById('summary-body');
    if (!valid.length) {
      body.innerHTML = '<div class="empty-state" style="color:rgba(255,255,255,.4);padding:20px 0">Add rows above to see the summary.</div>';
      return;
    }

    const totBase     = valid.reduce((s, x) => s + x.r.base,      0);
    const totAdded    = valid.reduce((s, x) => s + x.r.added,     0);
    const totNetFinal = valid.reduce((s, x) => s + x.netFinal,    0);
    const hasReduce   = valid.some(x => x.reduceBy > 0);
    const hasGSTRem   = valid.some(x => x.gstReduce > 0);
    const hasReverse  = valid.some(x => x.mode === 'reverse');

    const itemRows = valid.map((x, i) => {
      const label = x.d.desc || `Entry ${i + 1}`;
      let tag, sub;
      if (x.mode === 'direct') {
        tag = 'Direct';
        sub = `↳ Base: ${fmt(x.r.base)}`;
      } else {
        const rateTag = isGSTRate(x.r.rate) ? `${x.r.rate}% GST` : `${x.r.rate}%`;
        tag = rateTag;
        sub = `↳ Base: ${fmt(x.r.base)} + Added: ${fmt(x.r.added)}`;
      }
      if (x.reduceBy > 0)  sub += ` → After reduction: ${fmt(x.afterReduce)} (−${x.reduceBy}%)`;
      if (x.gstReduce > 0) sub += ` → Net: ${fmt(x.netFinal)} (−${x.gstReduce}% GST)`;
      const totalAmt = x.mode === 'direct' ? fmt(x.r.base) : fmt(x.r.total);
      return `<tr>
        <td>${label} <span class="muted-label">(${tag})</span></td>
        <td>${totalAmt}</td>
      </tr>
      <tr>
        <td style="padding-left:14px;font-size:.82rem" class="muted-label">${sub}</td>
        <td></td>
      </tr>`;
    }).join('');

    let html = `<table class="sum-table">${itemRows}`;

    if (hasReverse) {
      const totTotal = valid.filter(x => x.mode === 'reverse').reduce((s, x) => s + x.r.total, 0);
      html += `<tr class="sum-divider"><td>Total (inclusive, reverse rows)</td><td>${fmt(totTotal)}</td></tr>`;
    }
    html += `<tr${hasReverse ? '' : ' class="sum-divider"'}><td>Total Base Price</td><td>${fmt(totBase)}</td></tr>`;
    if (hasReverse) {
      html += `<tr><td>Total Added Component</td><td>${fmt(totAdded)}</td></tr>`;
    }

    if (hasGSTRem) {
      html += `<tr class="sum-total"><td>Total Net Final (pre-GST)</td><td>${fmt(totNetFinal)}</td></tr>`;
    } else if (hasReduce) {
      const totAfterReduce = valid.reduce((s, x) => s + x.afterReduce, 0);
      html += `<tr class="sum-total"><td>Total After Reductions</td><td>${fmt(totAfterReduce)}</td></tr>`;
    } else {
      html += `<tr class="sum-total"><td>Net Base (Pre-%)</td><td>${fmt(totBase)}</td></tr>`;
    }

    html += '</table>';
    body.innerHTML = html;
  }

  /* ── Copy summary ── */
  window.copyResults = function () {
    const ids   = Object.keys(rows);
    const valid = ids.map(id => {
      const cv = computeRow(rows[id]);
      if (!cv) return null;
      return { id, d: rows[id], ...cv };
    }).filter(Boolean);

    if (!valid.length) { toast('No data to copy.'); return; }

    const lines = valid.map((x, i) => {
      const label = x.d.desc || `Entry ${i + 1}`;
      let line;
      if (x.mode === 'direct') {
        line = `${label} (Direct Base)\n  Base: ₹${x.r.base.toFixed(2)}`;
      } else {
        const rateTag = isGSTRate(x.r.rate) ? `${x.r.rate}% GST` : `${x.r.rate}%`;
        line = `${label} (${rateTag})\n  Total: ₹${x.r.total.toFixed(2)}\n  Base:  ₹${x.r.base.toFixed(2)}\n  Added: ₹${x.r.added.toFixed(2)}`;
      }
      if (x.reduceBy > 0)  line += `\n  Reduction (${x.reduceBy}%): −₹${x.reduced.toFixed(2)} → ₹${x.afterReduce.toFixed(2)}`;
      if (x.gstReduce > 0) line += `\n  GST removed (${x.gstReduce}%): −₹${x.gstComponent.toFixed(2)} → Net: ₹${x.netFinal.toFixed(2)}`;
      return line;
    });

    const totBase     = valid.reduce((s, x) => s + x.r.base,   0);
    const totNetFinal = valid.reduce((s, x) => s + x.netFinal, 0);
    const hasGSTRem   = valid.some(x => x.gstReduce > 0);
    const hasReduce   = valid.some(x => x.reduceBy > 0);

    let footer = `\n\n─────────────────────\nTotal Base: ₹${totBase.toFixed(2)}`;
    if (hasReduce) {
      const totAfter = valid.reduce((s, x) => s + x.afterReduce, 0);
      footer += `\nAfter Red.: ₹${totAfter.toFixed(2)}`;
    }
    if (hasGSTRem) footer += `\nNet Final:  ₹${totNetFinal.toFixed(2)}`;

    navigator.clipboard.writeText(lines.join('\n\n') + footer)
      .then(() => toast('Copied to clipboard!'))
      .catch(() => toast('Copy failed — try selecting manually.'));
  };

})();
</script>
</body>
</html>
